<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura TO-BE - Proceso de Prestamos</title>
  <desc id="desc">Arquitectura de componentes con APISIX, Loan API, Cloud SQL, Pub/Sub, Worker e INARI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202124"/>
    </marker>
    <style>
      .title{font:700 26px Arial,sans-serif;fill:#202124}.subtitle{font:700 20px Arial,sans-serif;fill:#202124}.label{font:700 16px Arial,sans-serif;fill:#202124}.small{font:14px Arial,sans-serif;fill:#3c4043}.step{font:700 16px Arial,sans-serif;fill:#202124}.edge{stroke:#202124;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dashed{stroke:#202124;stroke-width:2;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="800" y="45" text-anchor="middle" class="title">ARQUITECTURA TO-BE</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Proceso de Prestamos</text>

  <rect x="210" y="120" width="1080" height="520" rx="4" fill="#f7f8fa" stroke="#dadce0" stroke-width="2"/>
  <text x="250" y="155" class="label">Google Cloud Platform</text>

  <circle cx="90" cy="355" r="44" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
