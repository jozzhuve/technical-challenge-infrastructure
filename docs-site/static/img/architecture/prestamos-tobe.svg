  <polygon points="335,370 380,300 425,370 405,370 380,330 355,370" fill="#ea4335"/>
  <text x="385" y="395" text-anchor="middle" class="label">Apache APISIX</text>
  <text x="385" y="415" text-anchor="middle" class="small">JWT | Rate Limit | Routing</text>

